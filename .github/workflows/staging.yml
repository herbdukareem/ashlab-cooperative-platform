name: Staging release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Confirm sandbox staging release
        required: true
        type: choice
        options: [sandbox]

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    environment: staging
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cooperative_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate:fresh --seed --force && php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cooperative_test
          DB_USERNAME: root
          DB_PASSWORD: root
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.production
          target: app
          push: true
          tags: ghcr.io/${{ github.repository }}-app:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.production
          target: web
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
